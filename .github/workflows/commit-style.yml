name: Commit Style

on: pull_request_target

permissions: {}

jobs:
  check-commit-format:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check commit format
        uses: Homebrew/actions/check-commit-format@ai-attribution-review-policy
        with:
          token: ${{ secrets.HOMEBREW_GITHUB_PUBLIC_REPO_TOKEN }}
